<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.25; }
      50% { transform: translateY(-20px) scale(1.15); opacity: 0.45; }
    }
    @keyframes sweepLine {
      0% { transform: translateX(-1200px); }
      100% { transform: translateX(1200px); }
    }
    @keyframes dashFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -200; }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    .orb-1 { animation: pulseOrb 8s ease-in-out infinite; }
    .orb-2 { animation: pulseOrb 10s ease-in-out infinite reverse; }
    .flow-line { stroke-dasharray: 8 12; animation: dashFlow 12s linear infinite; }
    .laser { animation: sweepLine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    .pill-box { animation: floatPill 5s ease-in-out infinite; }
    .pill-box-2 { animation: floatPill 6s ease-in-out infinite reverse; }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="360" fill="url(#cyberGrid)" rx="16" />

  <!-- Animated Glowing Orbs (Background depth) -->
  <circle class="orb-1" cx="200" cy="100" r="160" fill="#38bdf8" filter="url(#glow)" />
  <circle class="orb-2" cx="1000" cy="260" r="180" fill="#a855f7" filter="url(#glow)" />
  <circle class="orb-1" cx="600" cy="340" r="130" fill="#f43f5e" opacity="0.15" filter="url(#glow)" />

  <!-- Flowing Circuit / Stream Lines -->
  <path class="flow-line" d="M 0 100 Q 300 40 600 100 T 1200 100" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="2" />
  <path class="flow-line" d="M 0 280 Q 400 320 800 270 T 1200 290" fill="none" stroke="rgba(192, 132, 252, 0.25)" stroke-width="2" />
  <line x1="0" y1="358" x2="1200" y2="358" stroke="url(#accentGrad)" stroke-width="3" />

  <!-- Dynamic Sweeping Laser Accent -->
  <rect class="laser" y="357" width="300" height="2" fill="url(#accentGrad)" opacity="0.9" />

  <!-- Dynamic Foreground Tech Badges / Pills (Placed tastefully on sides/bottom so title stays clean) -->
  <g class="pill-box" transform="translate(80, 290)">
    <rect width="190" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#10b981" />
    <text x="34" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Zero-Allocation Core</text>
  </g>

  <g class="pill-box-2" transform="translate(910, 50)">
    <rect width="210" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(192, 132, 252, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#38bdf8" />
    <text x="34" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Cloud Toolchains &amp; IDEs</text>
  </g>

  <g class="pill-box" transform="translate(940, 290)">
    <rect width="180" height="32" rx="16" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(244, 63, 94, 0.4)" stroke-width="1.5" />
    <circle cx="20" cy="16" r="5" fill="#f59e0b" />
    <text x="34" y="21" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">Rust • C++ • C • Zig</text>
  </g>

  <!-- Central Header Text (Always in foreground and crisp) -->
  <g transform="translate(600, 80)">
    <rect x="-160" y="-18" width="320" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1" />
    <text text-anchor="middle" y="3" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="2">⚡ HIGH-PERFORMANCE ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="160" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="42" font-weight="900" fill="#ffffff" letter-spacing="-0.5">
    Systems Programming &amp; String Formatting
  </text>

  <!-- Subtitle -->
  <text x="600" y="206" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="18" font-weight="400" fill="#94a3b8">
    Curated Hub of SaaS Developer Cloud Platforms, High-Speed Compilers &amp; Fast Formatting Engines
  </text>

  <!-- Metric Badges in Center -->
  <g transform="translate(440, 238)">
    <rect width="145" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="72" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🚀 Zero-Copy I/O</text>
  </g>

  <g transform="translate(605, 238)">
    <rect width="155" height="28" rx="14" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
    <text x="77" y="18" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1">🛠️ Remote Toolchains</text>
  </g>
</svg>